<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Palco Digital</title>
  </head>
  <body>
    <header class="cabecalho">
      <div class="cabecalho__conteudo">
        <a class="cabecalho__logo" href="">
          <img
            class="cabecalho__logo-imagem"
            src="assets/images/logo-palco-digital.png"
            alt="Logo do Palco Digital"
          />
          Palco <span class="cabecalho__logo-destaque">Digital</span>
        </a>

        <nav class="cabecalho__navegacao" aria-label="Navegação principal">
          <ul class="cabecalho__menu">
            <li class="cabecalho__item">Eventos</li>
            <li class="cabecalho__item">Categorias</li>
            <li class="cabecalho__item">Programação</li>
            <li class="cabecalho__item">Por que Participar?</li>
            <li class="cabecalho__item">Inscrição</li>
            <li class="cabecalho__item">Sobre</li>
            <li class="cabecalho__item">Contato</li>
          </ul>
        </nav>
      </div>
    </header>

    <section class="hero-section">
      <div class="container">
        <div class="hero-content">
          <h1>
            O seu palco para aprender, <br />
            conectar e inspirar
          </h1>
          <p>
            A plataforma unificada para grandes encontros do saber e da arte.
          </p>
          <a href="#" class="btn-primary">
            Conhecer programação<span class="arrow">&rarr;</span></a
          >
        </div>
      </div>
    </section>
  </body>
</html>
